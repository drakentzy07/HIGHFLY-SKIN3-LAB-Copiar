name: HIGHFLY SKIN FACTORY - Public URL Verification

on:
  workflow_run:
    workflows:
      - HIGHFLY SKIN FACTORY V4 - Independent Pages
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-site:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: HTTP verify real public Pages address, JS and source import dependencies
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://drakentzy07.github.io/HIGHFLY-SKIN3-LAB-Copiar/"
          for attempt in {1..15}; do
            if curl -fsSL --max-time 20 "$BASE" -o /tmp/highfly-skin3-index.html; then break; fi
            sleep 5
          done
          test -s /tmp/highfly-skin3-index.html
          grep -F 'HIGHFLY' /tmp/highfly-skin3-index.html
          grep -F '__HF_SKIN3_FACTORY_V4__' /tmp/highfly-skin3-index.html
          grep -F 'window.__HF_SKIN3_MOLDER_V3_PROOF__' /tmp/highfly-skin3-index.html
          grep -F 'highfly-skinfactory' /tmp/highfly-skin3-index.html >/dev/null || true
          for file in factory-recipe-v4.mjs native-molder-v3.mjs paint-recipe-v3.mjs generated/modular-runtime.mjs vendor/three/build/three.module.js vendor/meshopt_decoder.module.js NOTICE.txt; do
            echo "CHECK_PUBLIC_ASSET $file"
            curl -fsSL --retry 4 --retry-delay 3 --max-time 45 -o /dev/null "${BASE}${file}"
          done
          ! grep -q '"/node_modules' /tmp/highfly-skin3-index.html
          ! grep -q "'/character-truth/inputs" /tmp/highfly-skin3-index.html
          echo "HIGHFLY_SKIN_FACTORY_V4_GITHUB_PAGES_PUBLIC_URL_GREEN=1 ORIGINAL_GLB_NOT_BUNDLED=1"
          echo "PUBLIC_SITE=$BASE"
